services:
  - type: web
    name: gezi-rehberi-streamlit
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT
    envVars:
      - key: STRAPI_URL
        value: https://gezi-rehberi-3ucn.onrender.com
      - key: STRAPI_API_TOKEN
        sync: false
